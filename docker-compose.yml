version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: retailos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: retailos_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/retailos
      - JWT_SECRET_KEY=RETAIL_OS_PRODUCTION_SECRET_KEY_987654321
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: retailos_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
